<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Newsreader:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2FA;--ink:#2A2140;--mute:#6B6283;--card:#fff;--line:#DDD6EA;--pink:#D9577F;--teal:#2F8F86}
@media (prefers-color-scheme:dark){:root{--bg:#1D1829;--ink:#F1ECF8;--mute:#A79FBB;--card:#2A2340;--line:#3C3458}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 'Newsreader',Georgia,serif}
header{display:flex;align-items:center;justify-content:space-between;padding:28px 40px;gap:16px;flex-wrap:wrap}
h1{font:700 34px 'Bricolage Grotesque',sans-serif;margin:0}
nav button{font:500 16px 'Bricolage Grotesque',sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;cursor:pointer}
nav button:first-child{border-radius:999px 0 0 999px}nav button:last-child{border-radius:0 999px 999px 0}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
main{padding:0 40px 60px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:36px 28px}
.book{background:none;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer;border-bottom:6px solid var(--line);padding:0 0 14px}
.cover{aspect-ratio:2/3;border-radius:4px 10px 10px 4px;display:flex;align-items:flex-end;padding:14px;color:#fff;font:700 20px/1.15 'Bricolage Grotesque',sans-serif;background-size:cover;background-position:center;box-shadow:inset 5px 0 0 rgba(0,0,0,.18)}
.book small{display:block;color:var(--mute);margin-top:8px}
.card{display:grid;grid-template-columns:240px 1fr;gap:40px;max-width:900px;background:var(--card);border:1px solid var(--line);padding:36px;border-radius:12px}
.card h2{font:700 36px 'Bricolage Grotesque',sans-serif;margin:0}
.card .by{color:var(--mute);font-style:italic;margin:4px 0 20px}
.stars{color:var(--pink);font-size:24px;letter-spacing:2px}
.tag{display:inline-block;border:1px solid var(--teal);color:var(--teal);padding:2px 12px;border-radius:999px;font:500 14px 'Bricolage Grotesque',sans-serif}
.back{background:none;border:0;color:var(--mute);font:500 16px 'Bricolage Grotesque',sans-serif;cursor:pointer;margin-bottom:16px;padding:0}
.empty{color:var(--mute)}
@media(max-width:700px){.card{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Reading Log</h1>
  <nav aria-label="View">
    <button id="v-lib" aria-pressed="true">Library</button><button id="v-card" aria-pressed="false">Card</button>
  </nav>
</header>
<main id="app"></main>
<script>
const colors=['#C4607A','#2F8F86','#6A4C93','#C9862B','#3D6FB6','#B8473F'];
let books=[],current=0,view='library';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cover=(b,i)=>{const bg=b.cover_id?`background-image:url(https://covers.openlibrary.org/b/id/${b.cover_id}-L.jpg)`:`background-color:${colors[i%colors.length]}`;return `<div class="cover" style="${bg}">${b.cover_id?'':esc(b.title)}</div>`};
const stars=r=>r?'★'.repeat(r)+'☆'.repeat(5-r):'Not rated yet';
function render(){
  if(!books.length){app.innerHTML='<p class="empty">Your library is empty. Ask Claude to add a book with the Reading Log server.</p>';return}
  if(view==='library'){
    app.innerHTML='<div class="shelf">'+books.map((b,i)=>`<button class="book" data-i="${i}">${cover(b,i)}<small>${esc(b.author)}</small></button>`).join('')+'</div>';
    app.querySelectorAll('.book').forEach(el=>el.onclick=()=>{current=+el.dataset.i;setView('card')});
  }else{
    const b=books[current];
    app.innerHTML=`<button class="back" id="back">Back to library</button><article class="card">${cover(b,current)}<div><h2>${esc(b.title)}</h2><p class="by">${esc(b.author)}</p><span class="tag">${esc(b.status)}</span><p>${esc(b.description)}</p><p class="stars" aria-label="Rating">${stars(b.rating)}</p><p>${esc(b.review)||'<span class="empty">No review yet.</span>'}</p></div></article>`;
    document.getElementById('back').onclick=()=>setView('library');
  }
}
function setView(v){view=v;document.getElementById('v-lib').setAttribute('aria-pressed',v==='library');document.getElementById('v-card').setAttribute('aria-pressed',v==='card');render()}
document.getElementById('v-lib').onclick=()=>setView('library');
document.getElementById('v-card').onclick=()=>setView('card');
fetch('../data/library.json').then(r=>r.json()).then(d=>{books=d;render()}).catch(()=>{app.innerHTML='<p class="empty">Could not load data/library.json. Run the site from the repo root (see README).</p>'});
</script>
</body>
</html>
